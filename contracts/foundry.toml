[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Allow deploy scripts to write deployment JSON artifacts.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
amoy = "${AMOY_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
anvil = "http://127.0.0.1:8545"

[invariant]
runs = 256
depth = 64
fail_on_revert = true
