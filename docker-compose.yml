version: '3.8'

services:
  # 1. TimescaleDB (PostgreSQL 16 with Timescale extension)
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: dex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dex_user
      POSTGRES_PASSWORD: dex_password
      POSTGRES_DB: dex_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dex_user -d dex_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 (Staging, Streams & Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: dex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Anvil Local Dev Ethereum Chain
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: dex-anvil
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337", "--block-time", "1"]
    ports:
      - "8545:8545"

  # 4. MinIO S3-Compatible Object Store (Raw Attestation Archive)
  minio:
    image: minio/minio:latest
    container_name: dex-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
